[package]
title = "{{ extension_display_name }}"
version = "{{ version }}"  # Semantic Versioning is used: https://semver.org/
description = "The simplest python service example extension. Use it as a starting point for your extensions."
category = "Example"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["kit", "extension", "setup"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme = "docs/README.md" # Path (relative to the root) or content of readme markdown file for UI
repository = "https://github.com/NVIDIA-Omniverse/kit-app-template"  # URL of the extension source repository


[dependencies]
"omni.services.core" = {}
"omni.services.transport.server.http" = {}
"omni.usd" = {}


[settings]
# Generated assets are only ever written directly inside this directory.
exts."{{ extension_name }}".output_dir = "${data}/{{ extension_name }}/generated"
# When empty, /generate_cube only accepts requests from loopback clients.
# Set it (e.g. --/exts/{{ extension_name }}/api_key=...) to require an X-API-Key header instead.
exts."{{ extension_name }}".api_key = ""


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import {{python_module}}"
name = '{{ extension_name }}'


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
]

args = [
]
